# Dependency updates arrive as pull requests, which is the only way into `main`
# anyway under the branch ruleset. They still need review and green CI.
version: 2
updates:
  # The pinned action versions in the workflows. An unpinned or stale action is
  # the most common supply chain exposure a repository this size actually has.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
    # One pull request for all of them. Ungrouped, a week's updates arrived as
    # five separate PRs, and because main requires branches to be up to date
    # and dismisses stale reviews, each merge forced the rest to rebase and be
    # re-approved. The cost is quadratic in PR count for changes that are
    # almost always trivial version bumps.
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies: the build requirements in pyproject.toml and the
  # pinned documentation toolchain in docs/requirements.txt, which this entry
  # is observed to update despite naming only the root directory. Runtime
  # dependencies are deliberately loose ranges, so they rarely appear here.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    # The linters are pinned on purpose: an unpinned formatter turns every
    # upstream release into a red build on an unrelated commit. Dependabot may
    # propose the bump, but it goes in as a deliberate reformat commit.
    groups:
      linters:
        patterns: ["ruff", "clang-format"]
      # The Sphinx stack and the build backend. These are pinned in
      # docs/requirements.txt and pyproject.toml and move together in
      # practice; the documentation job builds with -W, so a group that
      # breaks rendering fails as one unit rather than bisecting across
      # five separate pull requests.
      python-packages:
        patterns: ["*"]
        exclude-patterns: ["ruff", "clang-format"]
