# Read the Docs build configuration.
#
# The API reference is generated by autodoc against the installed package, so
# the build has to compile the C++ extension rather than just install the doc
# tooling. That is what the `pip install .` step below is for; it needs a
# compiler and CMake, which the ubuntu-24.04 image provides.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - cmake
    - ninja-build
  jobs:
    post_checkout:
      # Version detection in conf.py reads the installed distribution; a
      # shallow clone is fine, but the tags make `git describe` work for
      # anyone who adds it later.
      - git fetch --unshallow || true

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf
  - htmlzip
