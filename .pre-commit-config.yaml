# Optional but recommended: `pip install pre-commit && pre-commit install`.
# These hooks run the same checks CI runs (NFR-QA-4).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(python|tests|benchmarks)/

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: ^(include|src|tests/cpp)/.*\.(h|cpp)$

  # A public repository with a committed, executed notebook set has two ways
  # to leak: a credential in a source line, and a local path or hostname in a
  # cell's captured output. gitleaks covers the first. The second is what
  # actually happened here, so there is a check for it below.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-local-paths-in-notebooks
        name: no absolute home paths in notebook outputs
        entry: python scripts/check_notebook_paths.py
        language: python
        files: \.ipynb$
        pass_filenames: true
